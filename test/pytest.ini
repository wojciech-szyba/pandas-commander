[pytest]
asyncio_mode = auto
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers
; Safety net: async worker code (autosave timers, subprocess streaming, ...)
; can hang a test instead of failing it. timeout_method=thread lets pytest
; abort a stuck test without needing to interrupt the asyncio event loop.
timeout = 30
timeout_method = thread
